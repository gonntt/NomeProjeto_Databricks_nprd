bundle:
  name: nomeprojeto_databricks_nprd

# Dizemos ao Databricks EXATAMENTE o que queremos subir (sincronizar)
sync:
  include:
    - ./notebooks/**/* # Vai pegar todos os arquivos dentro da pasta 'notebooks' do repositório

targets:
  nprd:
    workspace:
      # O CLI descobre o host sozinho olhando para a variável DATABRICKS_HOST da esteira
      host: ${env.DATABRICKS_HOST} 
      
    # Caminho exato onde os notebooks vão "cair" lá dentro do Databricks
    # Como é desenvolvimento/homologação, ele cria uma pasta isolada
    root_path: /Users/${dash.current_user.userName}/projetos/${bundle.name}/${bundle.target}